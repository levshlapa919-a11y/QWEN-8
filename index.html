<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>golda-mesenger</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050b07;--p1:#0a130d;--p2:#0d1a11;--p3:#12241a;--line:rgba(61,255,133,.14);--line2:rgba(61,255,133,.32);--neon:#3dff85;--gold:#ffd34d;--red:#ff6161;--tx:#dcf7e6;--mut:#7da88c;--mut2:#5b8268;--accent:#3dff85;--font:'Manrope',system-ui,sans-serif;--disp:'Unbounded',sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--font);overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(1000px 640px at 10% -12%,rgba(61,255,133,.13),transparent 62%),radial-gradient(820px 560px at 108% 112%,rgba(255,211,77,.07),transparent 60%)}
.bg-grid{position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(61,255,133,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(61,255,133,.05) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(80% 70% at 50% 40%,#000 30%,transparent 100%);mask-image:radial-gradient(80% 70% at 50% 40%,#000 30%,transparent 100%)}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;pointer-events:none;z-index:0}
.o1{width:420px;height:420px;background:var(--accent);opacity:.08;top:-120px;left:-80px;animation:drift 26s ease-in-out infinite alternate}
.o2{width:360px;height:360px;background:var(--gold);opacity:.06;bottom:-140px;right:-60px;animation:drift 32s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(90px,60px) scale(1.15)}}
.hidden{display:none!important}

.btn{border:0;border-radius:12px;padding:12px 18px;font:800 14px var(--font);cursor:pointer;transition:.18s}
.btn.primary{background:linear-gradient(135deg,#43ff8d,#0fbe62);color:#03140a;box-shadow:0 0 22px rgba(61,255,133,.35),inset 0 0 0 1px rgba(255,255,255,.25);width:100%;margin-top:18px}
.btn.primary:hover{box-shadow:0 0 36px rgba(61,255,133,.6);transform:translateY(-1px)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--neon)}
.icon-btn{width:38px;height:38px;border-radius:11px;background:transparent;border:1px solid var(--line);color:var(--mut);display:grid;place-items:center;cursor:pointer;transition:.18s;flex:none}
.icon-btn:hover{color:var(--neon);border-color:var(--line2);box-shadow:0 0 14px rgba(61,255,133,.25)}
.icon-btn.gold{color:var(--gold);border-color:rgba(255,211,77,.35)}
.inp{width:100%;background:#08110b;border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:11px 14px;font:500 15px var(--font);outline:none;transition:.18s}
.inp:focus{border-color:var(--line2);box-shadow:0 0 0 3px rgba(61,255,133,.12)}
textarea.inp{resize:none}
.lbl{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px;font-weight:700}
.link{background:none;border:0;color:var(--neon);font:700 13px var(--font);cursor:pointer;text-decoration:underline}

.ava{border-radius:13px;object-fit:cover;display:grid;place-items:center;font:800 16px var(--disp);color:#eafff1;flex:none;user-select:none}
.ava.s{width:34px;height:34px;font-size:13px;border-radius:10px}
.ava.m{width:46px;height:46px}
.ava.l{width:86px;height:86px;font-size:30px;border-radius:22px}
.ava.ini{box-shadow:inset 0 0 0 1px var(--line2)}
.ava-wrap{position:relative;flex:none}
.dot{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:#3c5347;border:2.5px solid var(--bg)}
.dot.on{background:var(--neon);box-shadow:0 0 8px var(--neon)}
.dot.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid var(--neon);animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(.5);opacity:.9}to{transform:scale(1.5);opacity:0}}
.st-on{color:var(--neon);text-shadow:0 0 8px rgba(61,255,133,.6)}

.auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.auth-card{width:min(440px,100%);background:linear-gradient(165deg,var(--p2),var(--p1));border:1px solid var(--line);border-radius:20px;padding:34px 30px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(61,255,133,.08);animation:pop .45s cubic-bezier(.2,.9,.3,1.2);position:relative;z-index:2}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:22px}
.brand-mark{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font:800 30px var(--disp);color:#04120a;background:linear-gradient(135deg,#4bff95,#0db45c);box-shadow:0 0 30px rgba(61,255,133,.55),inset 0 0 0 1px rgba(255,255,255,.35);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 52px rgba(61,255,133,.9),inset 0 0 0 1px rgba(255,255,255,.35)}}
.brand-name{font:800 25px var(--disp);letter-spacing:.02em;text-shadow:0 0 24px rgba(61,255,133,.45)}
.brand-name b{color:var(--neon)}
.brand-tag{font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold)}
.tabs{display:flex;background:#07100a;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tab{flex:1;padding:9px;border:0;background:transparent;color:var(--mut);border-radius:9px;font:700 13px var(--font);cursor:pointer;transition:.18s}
.tab.active{background:linear-gradient(135deg,rgba(61,255,133,.2),rgba(61,255,133,.06));color:var(--neon);box-shadow:inset 0 0 0 1px var(--line2)}
.auth-msg{margin-top:12px;font-size:13px;color:var(--red);min-height:16px;text-align:center}
.auth-msg.ok{color:var(--neon)}

.app{position:relative;z-index:1;display:grid;grid-template-columns:350px 1fr;height:100dvh}
.side{display:flex;flex-direction:column;background:rgba(8,15,10,.85);backdrop-filter:blur(8px);border-right:1px solid var(--line);min-height:0}
.side-head{padding:15px 14px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.side-brand{font:800 15px var(--disp);text-shadow:0 0 16px rgba(61,255,133,.4);white-space:nowrap}
.side-brand b{color:var(--neon)}
.side-actions{display:flex;gap:6px}
.search{margin:4px 14px 10px;position:relative}
.search input{padding-left:14px}
.chat-list{flex:1;overflow-y:auto;padding:4px 10px 10px}
.chat-item{display:flex;gap:11px;padding:11px 10px;border-radius:14px;cursor:pointer;border:1px solid transparent;transition:.16s;position:relative}
.chat-item:hover{background:rgba(61,255,133,.05);transform:translateX(2px)}
.chat-item.active{background:rgba(61,255,133,.09);border-color:var(--line2)}
.chat-item.active::before{content:"";position:absolute;left:-1px;top:20%;bottom:20%;width:3px;border-radius:3px;background:var(--neon);box-shadow:0 0 10px var(--neon)}
.ci-body{flex:1;min-width:0}
.ci-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ci-name{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-time{font:500 11px var(--disp);color:var(--mut2);flex:none}
.ci-bottom{display:flex;justify-content:space-between;gap:8px;margin-top:3px;align-items:center}
.ci-prev{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{flex:none;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:linear-gradient(135deg,#ffe08a,#f5b800);color:#221a02;font:800 11.5px var(--font);display:grid;place-items:center;box-shadow:0 0 12px rgba(255,211,77,.45)}
.me{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);background:rgba(6,12,8,.6)}
.me-name{flex:1;min-width:0;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-name small{display:block;font:400 11px var(--disp);color:var(--mut2)}

.main{display:flex;flex-direction:column;min-width:0;height:100dvh}
.chat-head{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(8,15,10,.7);backdrop-filter:blur(10px);position:relative;z-index:6}
.head-info{display:flex;gap:11px;align-items:center;cursor:pointer;flex:1;min-width:0}
.h-name{font:800 15px var(--disp);transition:.15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-info:hover .h-name{color:var(--neon)}
.h-sub{font-size:12px;color:var(--mut);margin-top:2px}
.back{display:none}
.chat-menu{position:absolute;top:58px;right:14px;background:var(--p1);border:1px solid var(--line2);border-radius:13px;padding:6px;min-width:220px;display:none;box-shadow:0 18px 50px rgba(0,0,0,.6);z-index:20;animation:pop .18s ease}
.chat-menu.open{display:block}
.menu-i{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);font:600 13.5px var(--font);padding:10px 12px;border-radius:9px;cursor:pointer;transition:.14s}
.menu-i:hover{background:rgba(61,255,133,.1);color:var(--neon)}
.menu-i.danger:hover{background:rgba(255,97,97,.12);color:var(--red)}

.banner,.mod-banner{margin:10px 16px 0;padding:10px 16px;border-radius:12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:center}
.banner.red{background:rgba(255,97,97,.1);border:1px solid rgba(255,97,97,.4);color:#ffb3b3}
.banner.gold{background:rgba(255,211,77,.08);border:1px solid rgba(255,211,77,.35);color:#ffe7a3}
.banner.green{background:rgba(61,255,133,.07);border:1px solid var(--line2)}
.mod-banner{background:rgba(255,211,77,.1);border:1px solid rgba(255,211,77,.4);color:var(--gold)}

#msgScroll{flex:1;overflow-y:auto;padding:22px 18px}
.messages{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.day{align-self:center;font:600 11px var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);background:rgba(61,255,133,.07);border:1px solid var(--line);padding:5px 14px;border-radius:99px;margin:12px 0 4px}
.msg{display:flex;gap:10px;max-width:min(85%,640px);animation:msgIn .22s ease;align-items:flex-start}
.msg.own{align-self:flex-end;flex-direction:row-reverse}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.98)}}
.bubble{background:var(--p2);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 14px 8px;box-shadow:0 4px 18px rgba(0,0,0,.35);min-width:0;max-width:100%}
.msg.own .bubble{background:linear-gradient(160deg,var(--p3),var(--p2));border-color:var(--line2);border-radius:16px 4px 16px 16px}
.m-name{font:800 13px var(--font);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.m-name .sender-dot{width:8px;height:8px;border-radius:50%;flex:none}
.m-text{font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.m-text a{color:var(--gold)}
.m-time{font:500 10.5px var(--disp);color:var(--mut2);text-align:right;margin-top:4px}
.loading{text-align:center;color:var(--mut2);padding:30px;font-size:13px}

.input-bar{padding:12px 16px 16px;border-top:1px solid var(--line);background:rgba(8,15,10,.7)}
.ib-inner{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
#msgInput{flex:1;max-height:140px}
.send{width:46px;height:46px;border-radius:14px;border:0;background:linear-gradient(135deg,#43ff8d,#0fbe62);color:#03140a;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 20px rgba(61,255,133,.4);transition:.16s;flex:none}
.send:hover{transform:translateY(-2px) scale(1.04)}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--mut);padding:20px;text-align:center}
.empty .big-g{font:800 clamp(48px,10vw,96px) var(--disp);color:var(--accent);opacity:.3;text-shadow:0 0 40px var(--accent)}
.empty p{max-width:340px;font-size:14px;line-height:1.6}

.overlay{position:fixed;inset:0;background:rgba(3,8,5,.72);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}
.overlay.open{display:flex}
.modal{width:min(480px,100%);max-height:88dvh;overflow-y:auto;background:linear-gradient(170deg,var(--p2),var(--p1));border:1px solid var(--line2);border-radius:18px;padding:24px;box-shadow:0 40px 90px rgba(0,0,0,.65);animation:pop .25s cubic-bezier(.2,.9,.3,1.15)}
.modal.wide{width:min(660px,100%)}
.m-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
.m-title{font:800 17px var(--disp)}
.pick-list{margin-top:12px;display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto}
.pick-row{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s;background:rgba(255,255,255,.015)}
.pick-row:hover{border-color:var(--line2);background:rgba(61,255,133,.06);transform:translateX(2px)}
.pick-name{font-weight:700;font-size:14px}
.pick-sub{font:400 11.5px var(--disp);color:var(--mut2)}

#toasts{position:fixed;bottom:18px;left:50%;translate:-50%;display:flex;flex-direction:column;gap:8px;z-index:300;align-items:center}
.toast{background:var(--p1);border:1px solid var(--line2);color:var(--tx);padding:11px 18px;border-radius:12px;font-size:13px;box-shadow:0 12px 34px rgba(0,0,0,.5);animation:tIn .25s ease;max-width:min(480px,90vw);text-align:center}
.toast.red{border-color:rgba(255,97,97,.5)}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s}
@keyframes tIn{from{opacity:0;transform:translateY(10px)}}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--accent);opacity:.3;border-radius:8px;border:2px solid transparent;background-clip:content-box}

@media(max-width:900px){.app{grid-template-columns:1fr}.main{display:none}.app.chat-open .main{display:flex}.app.chat-open .side{display:none}.back{display:grid}}
</style>
</head>
<body>
<div class="bg-grid"></div><div class="orb o1"></div><div class="orb o2"></div>

<div id="authScreen" class="auth">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-mark">G</div>
      <div class="brand-name"><b>golda</b>-mesenger</div>
      <div class="brand-tag">neon chat</div>
    </div>
    <div class="tabs">
      <button class="tab active" id="tabLogin" type="button">Вход</button>
      <button class="tab" id="tabReg" type="button">Регистрация</button>
    </div>
    <form id="authForm">
      <label class="lbl">Почта</label>
      <input class="inp" id="authEmail" type="email" autocomplete="email" required placeholder="you@mail.com">
      <div id="unameWrap" class="hidden">
        <label class="lbl">Юзернейм (латиница, цифры, _)</label>
        <input class="inp" id="authUsername" placeholder="golda_king" maxlength="20">
      </div>
      <label class="lbl">Пароль (мин. 6 символов)</label>
      <input class="inp" id="authPass" type="password" autocomplete="current-password" required minlength="6" placeholder="••••••••">
      <button class="btn primary" id="authSubmit" type="submit">Войти</button>
      <div id="authMsg" class="auth-msg"></div>
    </form>
  </div>
</div>

<div id="setupScreen" class="auth hidden">
  <div class="auth-card">
    <div class="brand"><div class="brand-mark">G</div><div class="brand-name">Почти готово!</div><div class="brand-tag">придумай юзернейм</div></div>
    <form id="setupForm">
      <label class="lbl">Юзернейм</label>
      <input class="inp" id="setupUname" required maxlength="20" placeholder="golda_king">
      <label class="lbl">Отображаемое имя</label>
      <input class="inp" id="setupName" maxlength="30" placeholder="Как тебя видят другие">
      <button class="btn primary" type="submit">Начать общение</button>
      <div id="setupMsg" class="auth-msg"></div>
    </form>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="side">
    <div class="side-head">
      <div class="side-brand"><b>golda</b>-mesenger</div>
      <div class="side-actions">
        <button class="icon-btn" id="btnNewChat" title="Новый чат">＋</button>
        <button class="icon-btn" id="btnNewGroup" title="Создать группу">👥</button>
      </div>
    </div>
    <div class="search"><input class="inp" id="searchInput" placeholder="Поиск по чатам"></div>
    <div class="chat-list" id="chatList"></div>
    <div class="me">
      <div id="meAva"></div>
      <div class="me-name" id="meCard"><span id="meName"></span><small id="meUname"></small></div>
      <button class="icon-btn" id="btnLogout" title="Выйти"></button>
    </div>
  </aside>

  <main class="main">
    <div class="empty" id="emptyState">
      <div class="big-g">G</div>
      <p>Выбери чат слева или начни новый — сообщения доставляются мгновенно благодаря Supabase Realtime.</p>
      <button class="btn ghost" id="emptyNewChat">＋ Новый чат</button>
    </div>

    <div id="chatView" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <header class="chat-head">
        <button class="icon-btn back" id="backBtn">←</button>
        <div class="head-info" id="headInfo"><div id="headAva"></div><div style="min-width:0"><div class="h-name" id="headTitle"></div><div class="h-sub" id="headSub"></div></div></div>
        <button class="icon-btn" id="dotsBtn">⋮</button>
        <div class="chat-menu" id="chatMenu"></div>
      </header>
      <div class="banner green hidden" id="blockBanner"></div>
      <div id="msgScroll"><div class="messages" id="messages"></div></div>
      <footer class="input-bar" id="inputBar">
        <div class="ib-inner">
          <textarea class="inp" id="msgInput" rows="1" placeholder="Сообщение…"></textarea>
          <button class="send" id="sendBtn"></button>
        </div>
      </footer>
    </div>
  </main>
</div>

<div class="overlay" id="ncOverlay">
  <div class="modal">
    <div class="m-head"><div class="m-title">Новый чат</div><button class="icon-btn x" data-close>✕</button></div>
    <input class="inp" id="ncSearch" placeholder="Введи юзернейм для поиска…">
    <div class="pick-list" id="ncList"></div>
  </div>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="modal" style="width:min(380px,100%)">
    <div class="m-title" id="cfTitle"></div>
    <p style="color:var(--mut);font-size:14px;margin:10px 0 4px;line-height:1.5" id="cfText"></p>
    <div style="display:flex;gap:8px;margin-top:16px"><button class="btn ghost" id="cfCancel" style="flex:1">Отмена</button><button class="btn primary" id="cfOk" style="flex:1;margin:0">Да</button></div>
  </div>
</div>

<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const SUPABASE_URL='https://zuxvcqdttptahwinlnpz.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_crUm-uK9Hs0o_xgD5eVdyg_TaOgO3lH';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const $=s=>document.querySelector(s);
let ME=null,CHATS=[],BLOCKED=[],PROFILES={},USERS=[],UNREAD={};
let CURRENT=null,MSG_IDS=new Set(),rtChannel=null,hbTimer=null;
let SETUP_UID=null,SETUP_EMAIL='';
const ONLINE_MS=70000;

// ===== УТИЛИТЫ =====
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg,kind=''){const t=document.createElement('div');t.className='toast '+kind;t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),3200);},3200);}
function ru(m){const map={'Invalid login credentials':'Неверная почта или пароль','Email not confirmed':'Почта не подтверждена','User already registered':'Эта почта уже зарегистрирована','new row violates row-level security policy':'Действие запрещено'};return map[m]||m;}
const isOnline=p=>!!(p&&p.last_seen&&Date.now()-Date.parse(p.last_seen)<ONLINE_MS);
function fmtHM(iso){return new Date(iso).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}
function fmtListTime(iso){if(!iso)return '';const d=new Date(iso);return d.toDateString()===new Date().toDateString()?fmtHM(iso):d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});}
function fmtLastSeen(iso){if(!iso)return 'не в сети';const d=new Date(iso),n=new Date();if(d.toDateString()===n.toDateString())return 'был(а) в '+fmtHM(iso);const y=new Date(Date.now()-864e5);if(d.toDateString()===y.toDateString())return 'был(а) вчера в '+fmtHM(iso);return 'был(а) '+d.toLocaleDateString('ru-RU');}
function dayLabel(iso){const d=new Date(iso),n=new Date();if(d.toDateString()===n.toDateString())return 'сегодня';if(d.toDateString()===new Date(Date.now()-864e5).toDateString())return 'вчера';return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});}
function plural(n,a,b,c){n=Math.abs(n)%100;const d=n%10;if(n>10&&n<20)return c;if(d>1&&d<5)return b;if(d===1)return a;return c;}
const PALETTE=['#3dff85','#ffd34d','#6ee7ff','#ff9d5c','#c4ff5e','#7dffa8','#ffe08a','#5cffc9'];
function hashOf(s){let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))>>>0;return h;}
const nameColor=id=>PALETTE[hashOf(id)%PALETTE.length];
const GRADS=['linear-gradient(135deg,#14512e,#0a2818)','linear-gradient(135deg,#4d3b10,#241c06)','linear-gradient(135deg,#0f3d3d,#082020)','linear-gradient(135deg,#3d3510,#1f1b06)','linear-gradient(135deg,#274d10,#142606)'];
function avatarHTML(p,cls='m'){if(p&&p.avatar_url)return `<img class="ava ${cls}" src="${esc(p.avatar_url)}" alt="">`;const n=(p&&(p.display_name||p.username))||'?';return `<div class="ava ${cls} ini" style="background:${GRADS[hashOf(n)%GRADS.length]}">${esc(n[0].toUpperCase())}</div>`;}
function confirmBox(title,text){return new Promise(res=>{$('#cfTitle').textContent=title;$('#cfText').textContent=text;$('#confirmOverlay').classList.add('open');const done=v=>{$('#confirmOverlay').classList.remove('open');res(v);};$('#cfOk').onclick=()=>done(true);$('#cfCancel').onclick=()=>done(false);});}
const normUname=v=>v.trim().toLowerCase().replace(/\s+/g,'');
const validUname=v=>/^[a-z0-9_]{3,20}$/.test(v);

// ===== ВХОД/РЕГИСТРАЦИЯ =====
let mode='login';
function setMode(m){mode=m;$('#tabLogin').classList.toggle('active',m==='login');$('#tabReg').classList.toggle('active',m==='reg');$('#unameWrap').classList.toggle('hidden',m!=='reg');$('#authSubmit').textContent=m==='login'?'Войти':'Создать аккаунт';$('#authMsg').textContent='';}
$('#tabLogin').onclick=()=>setMode('login');
$('#tabReg').onclick=()=>setMode('reg');
function authMsg(t,ok){const el=$('#authMsg');el.textContent=t;el.classList.toggle('ok',!!ok);}

async function createProfile(uid,email,uname,dname){
  const {error}=await sb.from('profiles').insert({id:uid,email,username:uname,display_name:dname||uname});
  if(error){if(error.code==='23505')throw new Error('Этот юзернейм уже занят');if(error.message.includes('duplicate'))throw new Error('Эта почта уже зарегистрирована');throw error;}
  await sb.from('registrations').insert({user_id:uid,username:uname,email});
}

$('#authForm').onsubmit=async e=>{
  e.preventDefault();
  const email=$('#authEmail').value.trim(),pass=$('#authPass').value;
  const btn=$('#authSubmit');btn.disabled=true;authMsg('');
  try{
    if(mode==='login'){
      const {error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
      await enterApp();
    }else{
      const uname=normUname($('#authUsername').value);
      if(!validUname(uname))throw new Error('Юзернейм: 3–20 символов, только латиница, цифры и _');
      const {data,error}=await sb.auth.signUp({email,password:pass});
      if(error)throw error;
      if(!data.session){authMsg('Письмо отправлено — подтверди почту и войди ✔',true);setMode('login');return;}
      await createProfile(data.user.id,email,uname,uname);
      await enterApp();
    }
  }catch(err){authMsg(ru(err.message));}
  btn.disabled=false;
};

$('#setupForm').onsubmit=async e=>{
  e.preventDefault();
  const uname=normUname($('#setupUname').value);
  if(!validUname(uname)){$('#setupMsg').textContent='Юзернейм: 3–20 символов, латиница/цифры/_';return;}
  try{await createProfile(SETUP_UID,SETUP_EMAIL,uname,$('#setupName').value.trim()||uname);await enterApp();}
  catch(err){$('#setupMsg').textContent=ru(err.message);}
};

async function enterApp(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){showOnly('auth');return;}
  const {data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(!p){SETUP_UID=session.user.id;SETUP_EMAIL=session.user.email||'';showOnly('setup');return;}
  ME=p;PROFILES[p.id]=p;UNREAD={};CURRENT=null;
  showOnly('app');
  await Promise.all([fetchAllUsers(),loadChats(),loadBlocks()]);
  renderMe();renderChatList();
  subscribeRT();startHeartbeat();
}

async function fetchAllUsers(){const {data}=await sb.from('profiles').select('*').order('username').limit(1000);USERS=data||[];USERS.forEach(u=>PROFILES[u.id]=u);}
async function loadBlocks(){const {data}=await sb.from('blocks').select('blocked_id').eq('blocker_id',ME.id);BLOCKED=(data||[]).map(r=>r.blocked_id);}

async function loadChats(){
  const {data}=await sb.from('chat_members').select('chat_id, chats(id,type,name,avatar_url,created_by,created_at,chat_members(user_id,profiles(id,username,display_name,avatar_url,about,last_seen,is_banned,is_admin)))').eq('user_id',ME.id);
  CHATS=(data||[]).filter(r=>r.chats).map(r=>{const c=r.chats;return{id:c.id,type:c.type,name:c.name,avatar_url:c.avatar_url,created_by:c.created_by,created_at:c.created_at,members:c.chat_members.map(m=>m.profiles).filter(Boolean),lastMsg:null};});
  CHATS.forEach(c=>c.members.forEach(m=>PROFILES[m.id]=m));
  if(CHATS.length){
    const {data:msgs}=await sb.from('messages').select('chat_id,content,created_at,sender_id').in('chat_id',CHATS.map(c=>c.id)).order('created_at',{ascending:false}).limit(500);
    const last={};(msgs||[]).forEach(m=>{if(!last[m.chat_id])last[m.chat_id]=m;});
    CHATS.forEach(c=>c.lastMsg=last[c.id]||null);
  }
}

const titleOf=c=>c.type==='group'?(c.name||'Группа'):((otherOf(c).display_name||otherOf(c).username)||'…');
const otherOf=c=>c.members.find(m=>m.id!==ME.id)||{};

function renderMe(){
  $('#meAva').innerHTML=`<div class="ava-wrap">${avatarHTML(ME,'m')}<span class="dot on"></span></div>`;
  $('#meName').textContent=ME.display_name||ME.username;
  $('#meUname').textContent='@'+ME.username;
}

function previewOf(lm,chat){
  const who=lm.sender_id===ME.id?'Вы: ':(chat.type==='group'?((PROFILES[lm.sender_id]||{}).username||'')+': ':'');
  return esc(who+lm.content);
}

function renderChatList(){
  const q=($('#searchInput').value||'').toLowerCase();
  const ts=c=>c.lastMsg?Date.parse(c.lastMsg.created_at):Date.parse(c.created_at);
  const list=CHATS.filter(c=>titleOf(c).toLowerCase().includes(q)).sort((a,b)=>ts(b)-ts(a));
  $('#chatList').innerHTML=list.map(c=>{
    const o=c.type==='direct'?otherOf(c):null;
    const lm=c.lastMsg;
    const prev=lm?previewOf(lm,c):'<i>нет сообщений</i>';
    const unread=UNREAD[c.id]||0;
    const ava=c.type==='group'?`<div class="ava m ini" style="background:${GRADS[hashOf(c.name||c.id)%GRADS.length]}">${esc((c.name||'Г')[0].toUpperCase())}</div>`:`<div class="ava-wrap">${avatarHTML(o,'m')}<span class="dot ${isOnline(o)?'on':''}"></span></div>`;
    return `<div class="chat-item ${CURRENT===c.id?'active':''}" data-id="${c.id}">${ava}<div class="ci-body"><div class="ci-top"><span class="ci-name">${esc(titleOf(c))}</span><span class="ci-time">${lm?fmtListTime(lm.created_at):''}</span></div><div class="ci-bottom"><span class="ci-prev">${prev}</span>${unread?`<span class="badge">${unread>99?'99+':unread}</span>`:''}</div></div></div>`;
  }).join('')||'<div class="empty-note" style="color:var(--mut2);text-align:center;padding:24px">Чатов пока нет.<br>Нажми ＋ сверху, чтобы начать.</div>';
  document.querySelectorAll('.chat-item').forEach(el=>el.onclick=()=>openChat(el.dataset.id));
}
$('#searchInput').oninput=renderChatList;

function msgHTML(m,chat){
  const own=m.sender_id===ME.id;
  const p=PROFILES[m.sender_id]||{};
  const senderName=p.display_name||p.username||'—';
  const color=nameColor(m.sender_id);
  return `<div class="msg ${own?'own':''}" data-id="${m.id}">
    ${avatarHTML(p,'s')}
    <div class="bubble">
      <div class="m-name" style="color:${color}">
        <span class="sender-dot" style="background:${color}"></span>
        ${esc(senderName)}
        ${own?'<span style="font-size:11px;color:var(--mut);font-weight:400;margin-left:4px">(ты)</span>':''}
      </div>
      <div class="m-text">${esc(m.content)}</div>
      <div class="m-time">${fmtHM(m.created_at)}</div>
    </div>
  </div>`;
}

function renderMsgList(list,chat){
  let html='',lastDay='';
  for(const m of list){const d=dayLabel(m.created_at);if(d!==lastDay){html+=`<div class="day">${d}</div>`;lastDay=d;}html+=msgHTML(m,chat);}
  $('#messages').innerHTML=html||'<div class="empty-note" style="color:var(--mut2);text-align:center;padding:24px">Сообщений пока нет — напиши первым! 💬</div>';
}

function appendMsg(m,chat){
  const wrap=document.createElement('div');wrap.innerHTML=msgHTML(m,chat);
  const ph=$('#messages').querySelector('.empty-note');if(ph)ph.remove();
  $('#messages').appendChild(wrap.firstElementChild);
}
const scrollBottom=()=>requestAnimationFrame(()=>{$('#msgScroll').scrollTop=$('#msgScroll').scrollHeight;});

async function openChat(id){
  const chat=CHATS.find(c=>c.id===id);if(!chat)return;
  CURRENT=id;UNREAD[id]=0;
  $('#emptyState').classList.add('hidden');$('#chatView').classList.remove('hidden');
  $('#app').classList.add('chat-open');
  $('#msgInput').value='';$('#msgInput').style.height='auto';
  renderChatHeader();renderBlockBanner();renderChatList();
  $('#messages').innerHTML='<div class="loading">Загрузка сообщений…</div>';
  const {data}=await sb.from('messages').select('id,chat_id,sender_id,content,created_at').eq('chat_id',id).order('created_at',{ascending:true}).limit(300);
  if(CURRENT!==id)return;
  MSG_IDS=new Set((data||[]).map(m=>m.id));
  renderMsgList(data||[],chat);scrollBottom();
}

function closeChat(){CURRENT=null;$('#chatView').classList.add('hidden');$('#emptyState').classList.remove('hidden');$('#app').classList.remove('chat-open');$('#chatMenu').classList.remove('open');renderChatList();}
$('#backBtn').onclick=closeChat;

function renderChatHeader(){
  const chat=CHATS.find(c=>c.id===CURRENT);if(!chat){closeChat();return;}
  const menu=$('#chatMenu');menu.classList.remove('open');
  $('#headTitle').textContent=titleOf(chat);
  if(chat.type==='group'){
    $('#headAva').innerHTML=`<div class="ava m ini" style="background:${GRADS[hashOf(chat.name||chat.id)%GRADS.length]}">${esc((chat.name||'Г')[0].toUpperCase())}</div>`;
    $('#headSub').textContent=chat.members.length+' '+plural(chat.members.length,'участник','участника','участников');
    menu.innerHTML=`<button class="menu-i" data-act="leave">🚪 Покинуть группу</button><button class="menu-i danger" data-act="del">🗑 Удалить чат</button>`;
  }else{
    const o=otherOf(chat);
    $('#headAva').innerHTML=`<div class="ava-wrap">${avatarHTML(o,'m')}<span class="dot ${isOnline(o)?'on':''}"></span></div>`;
    $('#headSub').innerHTML=isOnline(o)?'<span class="st-on">● в сети</span>':'не в сети · '+fmtLastSeen(o.last_seen);
    const blocked=BLOCKED.includes(o.id);
    menu.innerHTML=`<button class="menu-i" data-act="block">${blocked?'🔓 Разблокировать пользователя':'🚫 Заблокировать пользователя'}</button><button class="menu-i danger" data-act="del">🗑 Удалить чат</button>`;
  }
}

$('#dotsBtn').onclick=e=>{e.stopPropagation();$('#chatMenu').classList.toggle('open');};
document.addEventListener('click',()=>$('#chatMenu').classList.remove('open'));
$('#chatMenu').onclick=async e=>{
  const act=e.target.closest('[data-act]')?.dataset.act;if(!act)return;
  const chat=CHATS.find(c=>c.id===CURRENT);if(!chat)return;
  if(act==='block')await toggleBlock(otherOf(chat).id);
  if(act==='del'){if(await confirmBox('Удалить чат?','Все сообщения будут удалены безвозвратно для всех участников.')){const {error}=await sb.from('chats').delete().eq('id',CURRENT);if(error)toast(ru(error.message),'red');else removeChatLocal(CURRENT);}}
  if(act==='leave'){if(await confirmBox('Покинуть группу?','Ты сможешь вернуться, только если тебя добавят снова.')){const {error}=await sb.from('chat_members').delete().eq('chat_id',CURRENT).eq('user_id',ME.id);if(error)toast(ru(error.message),'red');else removeChatLocal(CURRENT);}}
};
$('#headInfo').onclick=()=>{};

function renderBlockBanner(){
  const chat=CHATS.find(c=>c.id===CURRENT);
  const bb=$('#blockBanner');
  const show=chat&&chat.type==='direct'&&BLOCKED.includes(otherOf(chat).id);
  bb.classList.toggle('hidden',!show);
  if(show){const o=otherOf(chat);bb.textContent='🚫 Пользователь @'+o.username+' заблокирован. ';const b=document.createElement('button');b.className='link';b.textContent='Разблокировать';b.onclick=()=>toggleBlock(o.id);bb.appendChild(b);}
}

async function send(){
  const text=$('#msgInput').value.trim();
  if(!text||!CURRENT)return;
  const chat=CHATS.find(c=>c.id===CURRENT);
  if(chat.type==='direct'&&BLOCKED.includes(otherOf(chat).id)){toast('Сначала разблокируй пользователя');return;}
  $('#msgInput').value='';$('#msgInput').style.height='auto';
  const {data,error}=await sb.from('messages').insert({chat_id:CURRENT,sender_id:ME.id,content:text}).select().single();
  if(error){toast(ru(error.message),'red');return;}
  if(!MSG_IDS.has(data.id)){MSG_IDS.add(data.id);appendMsg(data,chat);scrollBottom();}
}
$('#sendBtn').onclick=send;
$('#msgInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
$('#msgInput').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,140)+'px';});

function bump(c){const i=CHATS.indexOf(c);if(i>0){CHATS.splice(i,1);CHATS.unshift(c);}}
function onMsgInsert(m){
  const chat=CHATS.find(c=>c.id===m.chat_id);if(!chat||MSG_IDS.has(m.id))return;
  MSG_IDS.add(m.id);chat.lastMsg=m;bump(chat);
  if(CURRENT===m.chat_id){appendMsg(m,chat);scrollBottom();}
  else if(m.sender_id!==ME.id){UNREAD[m.chat_id]=(UNREAD[m.chat_id]||0)+1;}
  renderChatList();
}
function onProfileUpdate(p){
  PROFILES[p.id]=p;
  if(ME&&p.id===ME.id){ME={...ME,...p};renderMe();}
  renderChatList();if(CURRENT)renderChatHeader();
}
function removeChatLocal(id){const i=CHATS.findIndex(c=>c.id===id);if(i>-1)CHATS.splice(i,1);if(CURRENT===id)closeChat();renderChatList();}
function onMembers(e){
  const row=(e.new&&Object.keys(e.new).length)?e.new:e.old;if(!row||!row.chat_id)return;
  if(row.user_id===ME.id){if(e.eventType==='DELETE')removeChatLocal(row.chat_id);else loadChats().then(renderChatList);return;}
  if(CHATS.some(c=>c.id===row.chat_id))loadChats().then(()=>{renderChatList();if(CURRENT===row.chat_id)renderChatHeader();});
}
function subscribeRT(){
  if(rtChannel)sb.removeChannel(rtChannel);
  rtChannel=sb.channel('golda-rt')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},e=>onMsgInsert(e.new))
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles'},e=>onProfileUpdate(e.new))
    .on('postgres_changes',{event:'*',schema:'public',table:'chat_members'},e=>onMembers(e))
    .subscribe();
}

function startHeartbeat(){
  const beat=async()=>{if(!ME)return;const now=new Date().toISOString();const {error}=await sb.from('profiles').update({last_seen:now}).eq('id',ME.id);if(!error)ME.last_seen=now;};
  beat();if(hbTimer)clearInterval(hbTimer);hbTimer=setInterval(beat,25000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')beat();});
}

async function toggleBlock(uid){
  if(BLOCKED.includes(uid)){
    const {error}=await sb.from('blocks').delete().eq('blocker_id',ME.id).eq('blocked_id',uid);
    if(error)return toast(ru(error.message),'red');
    BLOCKED=BLOCKED.filter(x=>x!==uid);toast('Пользователь разблокирован');
  }else{
    const {error}=await sb.from('blocks').insert({blocker_id:ME.id,blocked_id:uid});
    if(error)return toast(ru(error.message),'red');
    BLOCKED.push(uid);toast('Пользователь заблокирован 🚫');
  }
  if(CURRENT){renderChatHeader();renderBlockBanner();}
}

$('#btnNewChat').onclick=openNewChatModal;
$('#emptyNewChat').onclick=openNewChatModal;

function openNewChatModal(){
  $('#ncSearch').value='';ncRender('');$('#ncOverlay').classList.add('open');
}

async function ncRender(q){
  await fetchAllUsers();
  const query=(q||'').trim().toLowerCase();
  if(query.length<2){
    $('#ncList').innerHTML='<div class="empty-note" style="color:var(--mut2);text-align:center;padding:24px"> Введи юзернейм, чтобы найти человека<br>(минимум 2 символа)</div>';
    return;
  }
  const list=USERS.filter(u=>u.id!==ME.id&&((u.username||'').toLowerCase().includes(query)||(u.display_name||'').toLowerCase().includes(query)));
  $('#ncList').innerHTML=list.map(u=>`
    <div class="pick-row" data-uid="${u.id}">
      <div class="ava-wrap">${avatarHTML(u,'s')}<span class="dot ${isOnline(u)?'on':''}"></span></div>
      <div style="min-width:0"><div class="pick-name">${esc(u.display_name||u.username)}</div><div class="pick-sub">@${esc(u.username)}</div></div>
    </div>
  `).join('')||'<div class="empty-note" style="color:var(--mut2);text-align:center;padding:24px">Никого не нашлось по запросу «'+esc(query)+'»</div>';
  $('#ncList').querySelectorAll('.pick-row').forEach(r=>r.onclick=async()=>{
    $('#ncOverlay').classList.remove('open');await openDirectWith(r.dataset.uid);
  });
}
$('#ncSearch').oninput=e=>ncRender(e.target.value);

async function openDirectWith(uid){
  let chat=CHATS.find(c=>c.type==='direct'&&c.members.some(m=>m.id===uid));
  if(!chat){
    const {data:c,error}=await sb.from('chats').insert({type:'direct',created_by:ME.id}).select().single();
    if(error)return toast(ru(error.message),'red');
    await sb.from('chat_members').insert([{chat_id:c.id,user_id:ME.id},{chat_id:c.id,user_id:uid}]);
    await loadChats();renderChatList();
    chat=CHATS.find(x=>x.id===c.id);
  }
  if(chat)openChat(chat.id);
}

$('#btnNewGroup').onclick=()=>toast('Создание групп — в следующей версии 👥');

$('#btnLogout').onclick=async()=>{
  try{await sb.auth.signOut();}catch{}
  ME=null;CHATS=[];CURRENT=null;
  if(rtChannel){sb.removeChannel(rtChannel);rtChannel=null;}
  if(hbTimer)clearInterval(hbTimer);
  showOnly('auth');setMode('login');
  $('#authPass').value='';
};

document.querySelectorAll('.overlay').forEach(ov=>ov.addEventListener('click',e=>{if(e.target===ov)ov.classList.remove('open');}));
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.overlay').classList.remove('open'));
addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.overlay.open').forEach(o=>o.classList.remove('open'));$('#chatMenu').classList.remove('open');}});

function showOnly(screen){
  $('#authScreen').classList.toggle('hidden',screen!=='auth');
  $('#setupScreen').classList.toggle('hidden',screen!=='setup');
  $('#app').classList.toggle('hidden',screen!=='app');
}

(async function boot(){
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session)await enterApp();else showOnly('auth');
  }catch(err){console.error(err);showOnly('auth');}
})();
</script>
</body>
</html>
