<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>golda-mesenger</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050b07;color:#dcf7e6;font-family:'Manrope',sans-serif;height:100vh;overflow:hidden}
#app{display:grid;grid-template-columns:300px 1fr;height:100vh}
#sidebar{background:#0a130d;border-right:1px solid #1a2f1f;padding:20px;overflow-y:auto}
#main{display:flex;flex-direction:column;position:relative}
#chat-list{margin-top:20px}
.chat-item{padding:12px;border-radius:8px;cursor:pointer;margin-bottom:8px;background:#0d1a11;transition:.2s}
.chat-item:hover{background:#12241a}
.chat-item.active{background:#1a3a25;border-left:3px solid #3dff85}
.chat-name{font-weight:700;font-size:14px}
.chat-preview{font-size:12px;color:#7da88c;margin-top:4px}
#chat-view{display:none;flex-direction:column;height:100%}
#chat-header{padding:15px 20px;border-bottom:1px solid #1a2f1f;background:#0a130d}
#chat-title{font-weight:700;font-size:16px}
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.message{max-width:70%;padding:10px 14px;border-radius:12px;position:relative}
.message.own{align-self:flex-end;background:linear-gradient(135deg,#123a22,#0c2917);border-bottom-right-radius:4px}
.message.other{align-self:flex-start;background:#0d1a11;border-bottom-left-radius:4px}
.msg-sender{font-size:11px;color:#3dff85;font-weight:700;margin-bottom:4px}
.msg-text{font-size:14px;line-height:1.4}
.msg-time{font-size:10px;color:#7da88c;margin-top:4px;text-align:right}
#input-area{padding:15px 20px;border-top:1px solid #1a2f1f;background:#0a130d;display:flex;gap:10px}
#msg-input{flex:1;background:#0d1a11;border:1px solid #1a2f1f;border-radius:8px;padding:12px;color:#fff;font-size:14px;outline:none}
#msg-input:focus{border-color:#3dff85}
#send-btn{background:#3dff85;color:#03140a;border:0;border-radius:8px;padding:12px 20px;font-weight:700;cursor:pointer}
#send-btn:hover{background:#2dff75}
#login-screen{position:fixed;inset:0;background:#050b07;display:flex;align-items:center;justify-content:center;z-index:100}
#login-box{background:#0a130d;border:1px solid #1a2f1f;border-radius:16px;padding:40px;width:90%;max-width:400px}
#login-box h1{font-size:28px;margin-bottom:10px;color:#3dff85}
#login-box p{color:#7da88c;margin-bottom:30px;font-size:14px}
.input-field{width:100%;background:#0d1a11;border:1px solid #1a2f1f;border-radius:8px;padding:12px;color:#fff;font-size:14px;margin-bottom:15px;outline:none}
.input-field:focus{border-color:#3dff85}
.btn-primary{width:100%;background:#3dff85;color:#03140a;border:0;border-radius:8px;padding:14px;font-weight:700;font-size:16px;cursor:pointer;margin-top:10px}
.btn-primary:hover{background:#2dff75}
.btn-secondary{width:100%;background:transparent;color:#3dff85;border:1px solid #3dff85;border-radius:8px;padding:14px;font-weight:700;font-size:16px;cursor:pointer;margin-top:10px}
.tabs{display:flex;gap:10px;margin-bottom:20px}
.tab{flex:1;padding:10px;text-align:center;border-radius:8px;cursor:pointer;background:#0d1a11;color:#7da88c;font-weight:700}
.tab.active{background:#3dff85;color:#03140a}
#user-info{position:absolute;bottom:0;left:0;right:0;padding:15px;background:#0a130d;border-top:1px solid #1a2f1f;display:flex;align-items:center;gap:10px}
#user-avatar{width:40px;height:40px;border-radius:50%;background:#3dff85;display:flex;align-items:center;justify-content:center;font-weight:700;color:#03140a}
#user-name{font-weight:700;font-size:14px}
#user-email{font-size:12px;color:#7da88c}
.hidden{display:none!important}
#empty-state{flex:1;display:flex;align-items:center;justify-content:center;color:#7da88c;font-size:18px}
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-box">
    <h1> golda-mesenger</h1>
    <p>Неоновый мессенджер</p>
    <div class="tabs">
      <div class="tab active" id="tab-login">Вход</div>
      <div class="tab" id="tab-register">Регистрация</div>
    </div>
    <input class="input-field" id="email" type="email" placeholder="Почта">
    <input class="input-field" id="password" type="password" placeholder="Пароль (мин. 6 символов)">
    <input class="input-field hidden" id="username" type="text" placeholder="Юзернейм (латиница, цифры, _)">
    <button class="btn-primary" id="auth-btn">Войти</button>
    <div id="auth-msg" style="margin-top:15px;color:#ff6161;font-size:13px;text-align:center"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div id="sidebar">
    <h2 style="color:#3dff85;font-size:20px">💬 Чаты</h2>
    <div id="chat-list"></div>
    <div id="user-info">
      <div id="user-avatar">?</div>
      <div>
        <div id="user-name">Загрузка...</div>
        <div id="user-email"></div>
      </div>
    </div>
  </div>
  <div id="main">
    <div id="empty-state">Выбери чат слева или начни новый</div>
    <div id="chat-view">
      <div id="chat-header">
        <div id="chat-title">Чат</div>
      </div>
      <div id="messages"></div>
      <div id="input-area">
        <input id="msg-input" placeholder="Сообщение...">
        <button id="send-btn">➤</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://zuxvcqdttptahwinlnpz.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_crUm-uK9Hs0o_xgD5eVdyg_TaOgO3lH';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let ME=null;
let CHATS=[];
let CURRENT_CHAT=null;
let MSG_IDS=new Set();

// Табы входа/регистрации
document.getElementById('tab-login').onclick=()=>{
  document.getElementById('tab-login').classList.add('active');
  document.getElementById('tab-register').classList.remove('active');
  document.getElementById('username').classList.add('hidden');
  document.getElementById('auth-btn').textContent='Войти';
};
document.getElementById('tab-register').onclick=()=>{
  document.getElementById('tab-register').classList.add('active');
  document.getElementById('tab-login').classList.remove('active');
  document.getElementById('username').classList.remove('hidden');
  document.getElementById('auth-btn').textContent='Создать аккаунт';
};

// Авторизация
document.getElementById('auth-btn').onclick=async()=>{
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const username=document.getElementById('username').value.trim().toLowerCase();
  const msgEl=document.getElementById('auth-msg');
  msgEl.textContent='';
  
  if(!email||!password){
    msgEl.textContent='Введи почту и пароль';
    return;
  }
  
  const isLogin=document.getElementById('tab-login').classList.contains('active');
  
  try{
    if(isLogin){
      const {data,error}=await sb.auth.signInWithPassword({email,password});
      if(error)throw error;
      await loadApp();
    }else{
      if(!username||username.length<3){
        msgEl.textContent='Юзернейм должен быть минимум 3 символа';
        return;
      }
      if(!/^[a-z0-9_]+$/.test(username)){
        msgEl.textContent='Юзернейм: только латиница, цифры и _';
        return;
      }
      const {data,error}=await sb.auth.signUp({email,password});
      if(error)throw error;
      if(!data.session){
        msgEl.textContent='Письмо отправлено на почту — подтверди и войди';
        msgEl.style.color='#3dff85';
        return;
      }
      const {error:profError}=await sb.from('profiles').insert({
        id:data.user.id,
        email:email,
        username:username,
        display_name:username
      });
      if(profError)throw profError;
      await sb.from('registrations').insert({user_id:data.user.id,username:username,email:email});
      await loadApp();
    }
  }catch(err){
    msgEl.textContent='Ошибка: '+err.message;
    msgEl.style.color='#ff6161';
  }
};

async function loadApp(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return;
  
  const {data:profile}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(!profile){
    alert('Профиль не найден. Обратись к админу.');
    return;
  }
  
  ME=profile;
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('user-name').textContent=profile.display_name||profile.username;
  document.getElementById('user-email').textContent='@'+profile.username;
  document.getElementById('user-avatar').textContent=(profile.display_name||profile.username)[0].toUpperCase();
  
  await loadChats();
  subscribeToMessages();
}

async function loadChats(){
  const {data}=await sb.from('chat_members').select('chat_id, chats(*)').eq('user_id',ME.id);
  CHATS=(data||[]).map(r=>r.chats).filter(Boolean);
  renderChatList();
}

function renderChatList(){
  const list=document.getElementById('chat-list');
  if(CHATS.length===0){
    list.innerHTML='<div style="color:#7da88c;text-align:center;padding:20px">Чатов пока нет</div>';
    return;
  }
  list.innerHTML=CHATS.map(c=>`
    <div class="chat-item ${CURRENT_CHAT?.id===c.id?'active':''}" data-id="${c.id}">
      <div class="chat-name">${c.name||'Чат'}</div>
      <div class="chat-preview">Нажми чтобы открыть</div>
    </div>
  `).join('');
  
  list.querySelectorAll('.chat-item').forEach(el=>{
    el.onclick=()=>openChat(el.dataset.id);
  });
}

async function openChat(chatId){
  CURRENT_CHAT=CHATS.find(c=>c.id===chatId);
  if(!CURRENT_CHAT)return;
  
  document.getElementById('empty-state').classList.add('hidden');
  document.getElementById('chat-view').style.display='flex';
  document.getElementById('chat-title').textContent=CURRENT_CHAT.name||'Чат';
  
  renderChatList();
  await loadMessages();
}

async function loadMessages(){
  if(!CURRENT_CHAT)return;
  const {data}=await sb.from('messages').select('*').eq('chat_id',CURRENT_CHAT.id).order('created_at',{ascending:true});
  const msgs=data||[];
  MSG_IDS=new Set(msgs.map(m=>m.id));
  renderMessages(msgs);
}

function renderMessages(msgs){
  const container=document.getElementById('messages');
  container.innerHTML=msgs.map(m=>{
    const isOwn=m.sender_id===ME.id;
    const sender=ME.id===m.sender_id?ME:(CHATS.find(c=>c.id===CURRENT_CHAT.id)||{});
    return `
      <div class="message ${isOwn?'own':'other'}">
        ${!isOwn?`<div class="msg-sender">${m.sender_name||'Пользователь'}</div>`:''}
        <div class="msg-text">${escapeHtml(m.content)}</div>
        <div class="msg-time">${new Date(m.created_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</div>
      </div>
    `;
  }).join('');
  container.scrollTop=container.scrollHeight;
}

function escapeHtml(text){
  const div=document.createElement('div');
  div.textContent=text;
  return div.innerHTML;
}

// Отправка сообщения
document.getElementById('send-btn').onclick=sendMessage;
document.getElementById('msg-input').addEventListener('keypress',e=>{
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

async function sendMessage(){
  const input=document.getElementById('msg-input');
  const text=input.value.trim();
  if(!text||!CURRENT_CHAT)return;
  
  input.value='';
  
  const {data,error}=await sb.from('messages').insert({
    chat_id:CURRENT_CHAT.id,
    sender_id:ME.id,
    sender_name:ME.display_name||ME.username,
    content:text
  }).select().single();
  
  if(error){
    alert('Ошибка отправки: '+error.message);
    return;
  }
  
  if(!MSG_IDS.has(data.id)){
    MSG_IDS.add(data.id);
    const container=document.getElementById('messages');
    container.innerHTML+=`
      <div class="message own">
        <div class="msg-text">${escapeHtml(data.content)}</div>
        <div class="msg-time">${new Date(data.created_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</div>
      </div>
    `;
    container.scrollTop=container.scrollHeight;
  }
}

// Realtime подписка
function subscribeToMessages(){
  sb.channel('messages')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`chat_id=eq.${CURRENT_CHAT?.id||'*'}`},payload=>{
      const msg=payload.new;
      if(!MSG_IDS.has(msg.id)){
        MSG_IDS.add(msg.id);
        if(CURRENT_CHAT&&msg.chat_id===CURRENT_CHAT.id){
          const container=document.getElementById('messages');
          const isOwn=msg.sender_id===ME.id;
          container.innerHTML+=`
            <div class="message ${isOwn?'own':'other'}">
              ${!isOwn?`<div class="msg-sender">${msg.sender_name||'Пользователь'}</div>`:''}
              <div class="msg-text">${escapeHtml(msg.content)}</div>
              <div class="msg-time">${new Date(msg.created_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</div>
            </div>
          `;
          container.scrollTop=container.scrollHeight;
        }
      }
    })
    .subscribe();
}

// Автозагрузка при старте
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(session)await loadApp();
})();
</script>
</body>
</html>
