plugins { id 'com.android.application' }
android {
    namespace 'app.golda.mesenger'
    compileSdk 34
    defaultConfig { applicationId 'app.golda.mesenger'; minSdk 23; targetSdk 34; versionCode 19; versionName "2.8" }
    signingConfigs {
        main { storeFile file('../golda.keystore'); storePassword 'golda2026'; keyAlias 'golda'; keyPassword 'golda2026' }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.main }
        debug { signingConfig signingConfigs.main }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
