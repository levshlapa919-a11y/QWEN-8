name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || yes | "$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | head -1)/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | head -1)/sdkmanager" "platforms;android-34" "build-tools;34.0.0" | tail -3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: golda-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
      - name: Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk golda.apk
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest golda.apk --title "Golda APK" --notes "Скачай golda.apk и установи на Android"
