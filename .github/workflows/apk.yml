name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: apk
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || yes | "$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | head -1)/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | head -1)/sdkmanager" "platforms;android-34" "build-tools;34.0.0" | tail -3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Упаковать сайт в приложение
        run: |
          W=android/app/src/main/assets/www
          mkdir -p $W/vendor
          cp -r index.html manifest.json sw.js *.js *.css *.png *.svg *.mp3 *.jpg gifts $W/ 2>/dev/null || true
          curl -fsSL https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js -o $W/vendor/supabase.js
          python3 - <<'PY'
          import re
          p='android/app/src/main/assets/www/index.html'
          t=open(p).read()
          t=t.replace('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>','<script src="vendor/supabase.js"></script>')
          open(p,'w').write(t)
          PY
          ls $W | wc -l
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with: { name: golda-apk, path: android/app/build/outputs/apk/release/app-release.apk }
      - name: Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk yzitk.apk
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest yzitk.apk --title "YZITK Chats APK" --notes "Скачай yzitk.apk и установи на Android"
